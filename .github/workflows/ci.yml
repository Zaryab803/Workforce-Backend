name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://orbit:test_password_only@localhost:5432/orbit_test?schema=workforce_test
      DIRECT_URL: postgresql://orbit:test_password_only@localhost:5432/orbit_test?schema=workforce_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-secret-not-for-production-change-in-real-app-2026
      BCRYPT_ROUNDS: 10
      LOG_LEVEL: silent
      RATE_LIMIT_MAX: 10000
      LOGIN_RATE_LIMIT_MAX: 10000
      DOTENV_CONFIG_QUIET: true
      REDISMS_DISABLE_POSTINSTALL: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run check
      - run: npm run docs:check
      - run: npm test
